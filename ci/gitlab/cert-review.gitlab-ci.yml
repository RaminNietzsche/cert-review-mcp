# SEI CERT C/C++ review for GitLab merge requests.
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/RaminNietzsche/cert-review-mcp/v1/ci/gitlab/cert-review.gitlab-ci.yml'
#
# Publishes a Code Quality report (MR widget) and a SAST report (Security
# dashboard) and prints a Markdown summary. It never posts MR comments.
# Override any variable in your own .gitlab-ci.yml. See docs/action.md.
variables:
  CERT_REVIEW_SOURCE: "git+https://github.com/RaminNietzsche/cert-review-mcp@v1"
  CERT_REVIEW_PROFILE: "default"        # default | ceph | path to a profile YAML
  CERT_REVIEW_MODE: "diff"              # diff (MR changes) | full
  CERT_REVIEW_PATHS: "."                # full mode: files or directories
  CERT_REVIEW_COMPILE_COMMANDS: ""      # directory containing compile_commands.json
  CERT_REVIEW_TOOLS: "clang-tidy,cppcheck"
  CERT_REVIEW_MIN_CONFIDENCE: "0.5"
  CERT_REVIEW_FAIL_ON: "never"          # error | warning | note | never

cert-review:
  stage: test
  image: debian:trixie-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CERT_REVIEW_MODE == "full" && $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  before_script:
    # Versions match the toolchain behind docs/accuracy.md (Debian 13).
    - apt-get update -qq
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      git ca-certificates python3 python3-venv python3-pip
      clang-19=1:19.1.7-3+b1 clang-tidy-19=1:19.1.7-3+b1 cppcheck=2.17.1-2
      libc6-dev libstdc++-14-dev libboost-dev libssl-dev
    - ln -sf /usr/bin/clang-19 /usr/local/bin/clang
    - ln -sf /usr/bin/clang-tidy-19 /usr/local/bin/clang-tidy
    - python3 -m venv /opt/venv && /opt/venv/bin/pip install -q "$CERT_REVIEW_SOURCE"
    - export PATH=/opt/venv/bin:$PATH
  script:
    - export PATH=/opt/venv/bin:$PATH
    - COMMON="--profile $CERT_REVIEW_PROFILE --tools $CERT_REVIEW_TOOLS --min-confidence $CERT_REVIEW_MIN_CONFIDENCE"
    - if [ -n "$CERT_REVIEW_COMPILE_COMMANDS" ]; then COMMON="$COMMON --compdb $CERT_REVIEW_COMPILE_COMMANDS"; fi
    - |
      run() {  # run <format> <output>
        if [ "$CERT_REVIEW_MODE" = "diff" ]; then
          git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
          BASE=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)
          cert-review diff --repo . --base "$BASE" --head HEAD $COMMON --format "$1" -o "$2"
        else
          cert-review check $CERT_REVIEW_PATHS --root . $COMMON --format "$1" -o "$2"
        fi
      }
    - run codequality gl-code-quality-report.json
    - run gitlab-sast gl-sast-report.json
    - run markdown cert-review.md
    - cat cert-review.md
    - |
      if [ "$CERT_REVIEW_FAIL_ON" != "never" ]; then
        run json cert-review.json
        python3 - <<'PY'
      import json, os, sys
      order = {"note": 1, "warning": 2, "error": 3}
      t = order[os.environ["CERT_REVIEW_FAIL_ON"]]
      bad = [f for f in json.load(open("cert-review.json")) if order[f["severity"]] >= t]
      print(f"{len(bad)} finding(s) at or above {os.environ['CERT_REVIEW_FAIL_ON']}")
      sys.exit(1 if bad else 0)
      PY
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [cert-review.md]
    reports:
      codequality: gl-code-quality-report.json
      sast: gl-sast-report.json
