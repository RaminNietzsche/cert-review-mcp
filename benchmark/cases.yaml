# Real-code benchmark corpus for cert-review.
#
# Each case is one upstream fix of a security bug in C or C++ code. The fix commit and the
# vulnerable commit (its first parent) are taken from the project's own history; `files` are
# the non-test C/C++ files the fix touches, `functions` come from the diff hunk headers.
# `cwe` is the weakness as published (NVD, curl advisory) or, for fixes without a CVE, as read
# from the diff; `cert` is the best-matching SEI CERT rule or recommendation chosen by hand.
# `cert: []` marks design or logic flaws that no CERT coding rule describes; they are kept in
# the corpus and reported separately, not counted as misses of a checker.
#
# tools/run_real_benchmark.py reads this file; see docs/benchmark-real.md.
schema: 1
projects:
  ceph:
    repo: https://github.com/ceph/ceph
    sparse: ["/src/", "!/src/pybind/", "!/src/test/", "!/src/crimson/", "!/src/seastar/", "!/src/rocksdb/",
             "!/src/boost/", "!/src/spdk/", "!/src/dpdk/", "!/src/arrow/", "!/src/jaegertracing/"]
    compdb: ceph
    includes: [src/spawn/include, src/rgw, src/rgw/services, src/rgw/driver/rados]
    submodules: [src/fmt, src/s3select, src/xxHash, src/BLAKE3, src/rapidjson, src/spawn, src/dmclock]
  curl:
    repo: https://github.com/curl/curl
    includes: [include, lib, src]
    defines: [HAVE_CONFIG_H, BUILDING_LIBCURL]
    config_header: {path: lib/curl_config.h, text: curl}
    copy_if_missing: {include/curl/curlbuild.h: include/curl/curlbuild.h.dist}
  libexpat:
    repo: https://github.com/libexpat/libexpat
    subdir: expat
    includes: [expat/lib]
    defines: [XML_DTD, XML_NS, XML_GE=1, XML_CONTEXT_BYTES=1024, HAVE_EXPAT_CONFIG_H]
    config_header: {path: expat/expat_config.h, text: expat}
  libtiff:
    repo: https://gitlab.com/libtiff/libtiff
    includes: [libtiff]
    config_header: [{path: libtiff/tif_config.h, text: libtiff}, {path: libtiff/tiffconf.h, text: libtiff}]
  libarchive:
    repo: https://github.com/libarchive/libarchive
    includes: [libarchive, libarchive_fe, tar]
    defines: [HAVE_CONFIG_H]
    config_header: {path: config.h, text: libarchive}
  c-ares:
    repo: https://github.com/c-ares/c-ares
    includes: [include, src/lib, .]
    defines: [HAVE_CONFIG_H]
    config_header: {path: ares_config.h, text: c-ares}
    copy_if_missing: {ares_build.h: ares_build.h.dist}
  openssl:
    repo: https://github.com/openssl/openssl
    includes: [include, ., crypto, ssl]
    copy_if_missing: {crypto/opensslconf.h: crypto/opensslconf.h.in}
    header_links: {openssl: ["crypto/*.h", "crypto/*/*.h", "ssl/*.h", "e_os2.h"]}
