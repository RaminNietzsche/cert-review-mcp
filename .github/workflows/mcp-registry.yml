name: mcp-registry
# Publishes server.json to the official MCP Registry
# (https://registry.modelcontextprotocol.io) as io.github.RaminNietzsche/cert-review-mcp.
# Runs after docker-publish has pushed a release image, because the registry checks the
# io.modelcontextprotocol.server.name label on docker.io/raminnietzsche/cert-review-mcp:<version>.
# Authenticates with GitHub OIDC, so no token is stored.
on:
  workflow_run:
    workflows: [docker-publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.11
    steps:
      # Only tag pushes from this repository reach this point (see the job condition),
      # so the checked-out commit is trusted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: server.json version must match the package version
        run: |
          v_json=$(jq -r .version server.json)
          v_img=$(jq -r '.packages[0].identifier' server.json | sed 's/.*://')
          v_py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "server.json $v_json, image $v_img, pyproject $v_py"
          test "$v_json" = "$v_py" && test "$v_img" = "$v_py"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Check the registry entry
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.RaminNietzsche/cert-review-mcp" \
            | jq '.servers[] | {name: .server.name, version: .server.version, status: ._meta."io.modelcontextprotocol.registry/official".status}'
