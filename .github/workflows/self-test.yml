name: self-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clang_major: [18, 19, 20]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install analyzers (clang ${{ matrix.clang_major }})
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.clang_major }} clang-tidy-${{ matrix.clang_major }} cppcheck
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ matrix.clang_major }} 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${{ matrix.clang_major }} 100
      - run: pip install -e '.[dev]' semgrep==1.186.0
      - run: pytest -q

  docker-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP image
        run: docker build -f Dockerfile.mcp -t cert-review:mcp .
      - name: Tests in image
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            --entrypoint bash cert-review:mcp -c \
            "pip install -q -e '.[dev]' && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q"

  action:
    # Runs the action from this checkout on a few corpus examples.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Full mode on corpus samples
        id: full
        uses: ./
        with:
          mode: full
          paths: |
            corpus/ERR34-C
            corpus/MSC30-C
            corpus/EXP42-C
          profile: default
          min-confidence: "0.5"
          fail-on: never
          sarif-file: cert-review-full.sarif
      - name: Check the outputs
        run: |
          echo "findings=${{ steps.full.outputs.findings }}"
          test "${{ steps.full.outputs.findings }}" -ge 3
          python3 - <<'PY'
          import json
          d = json.load(open("cert-review-full.sarif"))
          assert d["version"] == "2.1.0"
          ids = {r["ruleId"] for r in d["runs"][0]["results"]}
          assert {"ERR34-C", "MSC30-C", "EXP42-C"} <= ids, ids
          PY
      - name: fail-on makes the step fail
        id: gate
        continue-on-error: true
        uses: ./
        with:
          mode: full
          paths: corpus/ERR34-C
          fail-on: warning
          sarif-file: cert-review-gate.sarif
      - name: Gate must have failed
        run: test "${{ steps.gate.outcome }}" = "failure"
      - name: Diff mode on this pull request
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: diff
          include: "src/**,tools/**"
          sarif-file: cert-review-diff.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif
          path: "*.sarif"
