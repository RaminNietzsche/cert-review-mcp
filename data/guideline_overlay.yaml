# Hand-written overlay for data/guidelines.json (input to tools/build_guidelines.py).
#
# Everything in this file was written for cert-review-mcp. It contains NO text from
# the MISRA or AUTOSAR documents: `summaries` are short paraphrases of each guideline's
# subject, written in our own words so that a reader can recognise the guideline. They
# are not the official headlines and must not be quoted as such. Users who hold a
# licence can load the official texts at run time (see docs/misra-autosar.md).
#
# `sections` are topic names: MISRA C:2012 chapter subjects, and ISO C++ clause names
# for MISRA C++:2023 (C++17 clauses) and AUTOSAR C++14 (C++14 clauses).
#
# `checkers` are mappings curated in this repository from the analyzers' own
# documentation of what each check reports. `specific: true` means the check reports
# exactly the pattern the guideline forbids (a rule-specific checker); otherwise it
# catches only some violations. `line_regex` (optional) keeps a mapping only when the
# reported source line matches, for checks that cover several guidelines at once.

