summaries:
  misra-c-2012:
    "DIR-1.1": "Know and document every implementation-defined behaviour the program relies on."
    "DIR-2.1": "All source files must build without compilation errors."
    "DIR-3.1": "Code should be traceable to documented requirements."
    "DIR-4.1": "Keep the risk of run-time failures as low as possible."
    "DIR-4.2": "Document any use of assembly language."
    "DIR-4.3": "Keep assembly language isolated and wrapped (e.g. in functions or macros)."
    "DIR-4.4": "Do not leave blocks of code disabled by turning them into comments."
    "DIR-4.5": "Identifiers visible at the same time should not look alike."
    "DIR-4.6": "Prefer typedefs that state size and signedness over the plain numeric types."
    "DIR-4.7": "Check the error information a function returns."
    "DIR-4.8": "Hide the layout of structures that a translation unit never needs to look inside."
    "DIR-4.9": "Prefer functions to function-like macros where either would do."
    "DIR-4.10": "Guard header files against multiple inclusion."
    "DIR-4.11": "Check arguments before passing them to library functions."
    "DIR-4.12": "Avoid dynamic memory allocation."
    "DIR-4.13": "Call functions that operate on a resource in the correct order."
    "DIR-4.14": "Validate data that comes from outside the program."
    "DIR-4.15": "Handle floating-point infinities and NaNs explicitly."
    "DIR-5.1": "Prevent data races on objects shared between threads."
    "DIR-5.2": "Prevent deadlocks between threads."
    "DIR-5.3": "Do not create threads dynamically."
    "1.1": "Stay within the C language: no syntax or constraint errors and no translation limits exceeded."
    "1.2": "Avoid compiler-specific language extensions."
    "1.3": "Do not rely on undefined or critical unspecified behaviour."
    "1.4": "Avoid the newer language features the guidelines flag as emergent."
    "1.5": "Avoid language features marked obsolescent in the C standard."
    "2.1": "No code that can never be reached."
    "2.2": "No operations whose removal would not change program behaviour (dead code)."
    "2.3": "No type declarations that are never used."
    "2.4": "No tag declarations that are never used."
    "2.5": "No macro definitions that are never used."
    "2.6": "No labels that are never used."
    "2.7": "No function parameters that are never used."
    "2.8": "No object definitions that are never used."
    "3.1": "Do not nest comment openers inside a comment."
    "3.2": "Do not continue a // comment onto the next line with a backslash."
    "4.1": "End octal and hexadecimal escape sequences unambiguously."
    "4.2": "Do not use trigraphs."
    "5.1": "Identifiers with external linkage must be distinguishable."
    "5.2": "Identifiers in the same scope and name space must be distinguishable."
    "5.3": "Do not hide an outer-scope identifier with an inner declaration."
    "5.4": "Macro names must be distinguishable from each other."
    "5.5": "Do not reuse a macro name as another identifier."
    "5.6": "Each typedef name is used for one type only."
    "5.7": "Each tag name is used for one type only."
    "5.8": "Names of objects and functions with external linkage are not reused."
    "5.9": "Names of objects and functions with internal linkage should not be reused."
    "6.1": "Declare bit-fields only with suitable types."
    "6.2": "A one-bit named bit-field must be unsigned."
    "6.3": "Do not put bit-fields in unions."
    "7.1": "Do not write octal integer constants."
    "7.2": "Mark integer constants that have an unsigned type with a U suffix."
    "7.3": "Use an upper-case L, never a lower-case l, in literal suffixes."
    "7.4": "Only assign string literals to pointers to const char."
    "7.5": "Give integer-constant macros an argument of the right form."
    "7.6": "Do not use the minimum-width constant macros for the small integer types."
    "8.1": "Always state types explicitly (no implicit int)."
    "8.2": "Declare functions with full prototypes that name their parameters."
    "8.3": "All declarations of an object or function use the same names and qualifiers."
    "8.4": "Make a compatible declaration visible before defining an externally linked object or function."
    "8.5": "Declare an external object or function once, in one file."
    "8.6": "An externally linked identifier has exactly one definition."
    "8.7": "Do not give external linkage to something used in only one translation unit."
    "8.8": "Use static on every declaration of an internally linked object or function."
    "8.9": "Define an object at block scope if only one function uses it."
    "8.10": "Declare inline functions static."
    "8.11": "Give externally linked arrays an explicit size."
    "8.12": "Implicitly valued enumeration constants must not duplicate another value in the list."
    "8.13": "Point to const-qualified types whenever the pointee is not modified."
    "8.14": "Do not use the restrict qualifier."
    "8.15": "Every declaration of an explicitly aligned object specifies the same alignment."
    "8.16": "Do not specify an alignment of zero."
    "8.17": "Use at most one explicit alignment specifier per declaration."
    "9.1": "Do not read an automatic object before it has been given a value."
    "9.2": "Brace the initializer of an aggregate or union."
    "9.3": "Do not initialise only part of an array."
    "9.4": "Do not initialise the same element twice."
    "9.5": "Size arrays explicitly when designated initializers are used."
    "9.6": "Do not mix chained designators with undesignated initializers."
    "9.7": "Initialise atomic objects properly before they are accessed."
    "10.1": "Operands must have an essential type that suits the operator."
    "10.2": "Use character-typed operands in additions and subtractions only in sensible ways."
    "10.3": "Do not assign a value to a narrower essential type or a different essential type category."
    "10.4": "Operands of an arithmetic operator that balances types should share an essential type category."
    "10.5": "Avoid casts to an inappropriate essential type."
    "10.6": "Do not assign a composite expression to a wider essential type."
    "10.7": "Do not widen the other operand of an operator whose operand is a composite expression."
    "10.8": "Do not cast a composite expression to a wider type or a different category."
    "11.1": "No conversions between function pointers and any other type."
    "11.2": "No conversions between pointers to incomplete types and any other type."
    "11.3": "No casts between pointers to different object types."
    "11.4": "Avoid conversions between pointers and integers."
    "11.5": "Avoid converting void pointers into object pointers."
    "11.6": "No casts between void pointers and arithmetic types."
    "11.7": "No casts between object pointers and non-integer arithmetic types."
    "11.8": "Do not cast away const, volatile or _Atomic qualification."
    "11.9": "Write null pointer constants only as NULL."
    "11.10": "Do not apply _Atomic to void."
    "12.1": "Make operator precedence explicit with parentheses."
    "12.2": "Keep shift amounts within the width of the left operand's essential type."
    "12.3": "Avoid the comma operator."
    "12.4": "Avoid unsigned wrap-around when evaluating constant expressions."
    "12.5": "Do not apply sizeof to a parameter declared as an array."
    "12.6": "Do not access members of atomic structures or unions directly."
    "13.1": "Initializer lists must not have persistent side effects."
    "13.2": "An expression's value and side effects must not depend on evaluation order."
    "13.3": "Keep ++ and -- out of expressions that have other side effects."
    "13.4": "Do not use the result of an assignment as a value."
    "13.5": "The right operand of && or || must not have persistent side effects."
    "13.6": "The operand of sizeof must not have side effects."
    "14.1": "Loop counters must not be floating-point."
    "14.2": "Write for loops in a well-formed shape."
    "14.3": "Controlling expressions must not be invariant."
    "14.4": "if and loop conditions must be essentially Boolean."
    "15.1": "Avoid goto."
    "15.2": "goto may only jump forward within the same function."
    "15.3": "goto may only jump to a label in the same or an enclosing block."
    "15.4": "Leave a loop through at most one break or goto."
    "15.5": "Prefer a single exit point at the end of a function."
    "15.6": "Loop and selection bodies must be compound statements (braced)."
    "15.7": "End every if ... else if chain with a final else."
    "16.1": "Write switch statements in a well-formed shape."
    "16.2": "Place switch labels only directly in the switch body."
    "16.3": "End every switch clause with an unconditional break."
    "16.4": "Give every switch a default label."
    "16.5": "Put the default label first or last."
    "16.6": "A switch needs at least two clauses."
    "16.7": "Do not switch on an essentially Boolean expression."
    "17.1": "Do not use the <stdarg.h> facilities."
    "17.2": "No direct or indirect recursion."
    "17.3": "Never call a function that has not been declared."
    "17.4": "Every exit path of a non-void function returns a value."
    "17.5": "Pass array arguments with enough elements for the parameter."
    "17.6": "Do not put static inside the brackets of an array parameter."
    "17.7": "Use the value returned by a non-void function."
    "17.8": "Do not modify function parameters."
    "17.9": "A _Noreturn function must not return."
    "17.10": "A _Noreturn function must have a void return type."
    "17.11": "Declare functions that never return as _Noreturn."
    "17.12": "Use a function name only to call it or with &."
    "17.13": "Do not qualify function types."
    "18.1": "Pointer arithmetic must stay within the same array."
    "18.2": "Subtract pointers only when they point into the same array."
    "18.3": "Compare pointers relationally only within the same object."
    "18.4": "Avoid +, -, += and -= on pointers."
    "18.5": "Use at most two levels of pointer indirection in declarations."
    "18.6": "Do not let the address of an automatic or thread-local object outlive it."
    "18.7": "Do not declare flexible array members."
    "18.8": "Do not use variable-length arrays."
    "18.9": "Do not convert an array with temporary lifetime into a pointer."
    "18.10": "Do not use pointers to variably-modified array types."
    "19.1": "Do not copy or assign an object onto storage that overlaps it."
    "19.2": "Avoid unions."
    "20.1": "Put #include directives before any code."
    "20.2": "Keep quote, backslash and comment characters out of header file names."
    "20.3": "#include must be followed by <file> or \"file\"."
    "20.4": "Do not define macros named like keywords."
    "20.5": "Avoid #undef."
    "20.6": "Do not put directive-like tokens inside macro arguments."
    "20.7": "Parenthesise macro parameters when they are expanded in expressions."
    "20.8": "#if and #elif conditions must evaluate to 0 or 1."
    "20.9": "Define identifiers before using them in #if or #elif."
    "20.10": "Avoid the # and ## preprocessor operators."
    "20.11": "Do not follow a stringised parameter directly with ##."
    "20.12": "A parameter used with # or ## must not also be macro-expanded elsewhere in the body."
    "20.13": "Lines starting with # must be valid preprocessing directives."
    "20.14": "Keep #else, #elif and #endif in the same file as their #if."
    "21.1": "Do not #define or #undef reserved identifiers or macros."
    "21.2": "Do not declare reserved identifiers or macro names."
    "21.3": "Do not use the <stdlib.h> allocation and deallocation functions."
    "21.4": "Do not use <setjmp.h>."
    "21.5": "Do not use <signal.h>."
    "21.6": "Do not use the standard library input/output functions."
    "21.7": "Do not use the ato* string conversion functions."
    "21.8": "Do not use the <stdlib.h> program termination functions."
    "21.9": "Do not use bsearch or qsort."
    "21.10": "Do not use the standard time and date functions."
    "21.11": "Do not use <tgmath.h>."
    "21.12": "Avoid the floating-point exception features of <fenv.h>."
    "21.13": "Pass <ctype.h> functions only unsigned char values or EOF."
    "21.14": "Do not compare null-terminated strings with memcmp."
    "21.15": "memcpy, memmove and memcmp take pointers to compatible types."
    "21.16": "Use memcmp only on suitable types (pointer, integer, Boolean, enum)."
    "21.17": "<string.h> functions must not read or write out of bounds."
    "21.18": "size_t arguments to <string.h> functions must be in range."
    "21.19": "Treat pointers from localeconv, getenv, setlocale and strerror as pointers to const."
    "21.20": "Do not use a pointer from asctime, getenv and similar after calling the same function again."
    "21.21": "Do not call system."
    "21.22": "Type-generic math macros need operands of a suitable essential type."
    "21.23": "Operands of multi-argument type-generic math macros share one standard type."
    "21.24": "Do not use rand or srand."
    "21.25": "Use only sequentially consistent memory ordering."
    "21.26": "Call mtx_timedlock only on mutexes that support timeouts."
    "22.1": "Release every resource that was acquired dynamically."
    "22.2": "Free only memory obtained from the standard allocation functions."
    "22.3": "Do not open one file for reading and writing on separate streams at the same time."
    "22.4": "Do not write to a read-only stream."
    "22.5": "Do not dereference a FILE pointer."
    "22.6": "Do not use a FILE pointer after its stream has been closed."
    "22.7": "Compare EOF only with the unmodified result of a function that can return it."
    "22.8": "Set errno to zero before calling a function that sets it."
    "22.9": "Test errno after calling a function that sets it."
    "22.10": "Test errno only right after a function that sets it."
    "22.11": "Join or detach a thread at most once."
    "22.12": "Access thread, synchronisation and TSS objects only through their library functions."
    "22.13": "Give thread, synchronisation and TSS objects a suitable storage duration."
    "22.14": "Initialise synchronisation objects before use."
    "22.15": "Destroy synchronisation and TSS objects only after every thread using them has finished."
    "22.16": "A thread unlocks every mutex it locks."
    "22.17": "Only unlock, or wait on, a mutex that the calling thread holds."
    "22.18": "Do not lock a non-recursive mutex twice."
    "22.19": "Use a condition variable with one mutex only."
    "22.20": "Create thread-specific storage before accessing it."
    "23.1": "Use generic selections only inside macro expansions."
    "23.2": "A generic selection written outside a macro must have no side effects in its controlling expression."
    "23.3": "A generic selection should list at least one non-default association."
    "23.4": "Associations in a generic selection must use suitable types."
    "23.5": "Generic selections should not rely on implicit pointer conversions."
    "23.6": "The controlling expression's essential type must match its standard type."
    "23.7": "A macro containing a generic selection evaluates its argument once."
    "23.8": "Put the default association first or last."
  misra-cpp-2023:
    "0.0.1": "No statements that can never be reached."
    "0.0.2": "Controlling expressions should not be invariant."
    "0.1.1": "Avoid writing values to local objects that are never read afterwards."
    "0.1.2": "Use the value a function returns."
    "0.2.1": "Locally visible variables should be used."
    "0.2.2": "Named function parameters must be used."
    "0.2.3": "Locally visible types should be used."
    "0.2.4": "Locally visible functions should be used."
    "DIR-0.3.1": "Use floating-point arithmetic with care."
    "DIR-0.3.2": "Respect the preconditions of the functions you call."
    "4.1.1": "Conform to ISO C++17."
    "4.1.2": "Avoid deprecated language features."
    "4.1.3": "Do not rely on undefined or critical unspecified behaviour."
    "4.6.1": "Sequence accesses to the same memory location correctly."
    "5.0.1": "Avoid character sequences that look like trigraphs."
    "5.7.1": "Do not nest /* inside a C-style comment."
    "DIR-5.7.2": "Do not leave code disabled by commenting it out."
    "5.7.3": "Do not continue a // comment with a backslash."
    "5.13.3": "Do not write octal integer constants."
    "5.13.4": "Suffix unsigned integer literals with U."
    "5.13.5": "Use an upper-case L, never a lower-case l, to start a literal suffix."
    "6.2.1": "Do not violate the one-definition rule."
    "6.4.1": "Do not hide an outer-scope variable with an inner declaration."
    "6.8.1": "Do not access an object outside its lifetime."
    "6.8.2": "Do not return a pointer or reference to a local automatic object."
    "7.11.1": "Use nullptr as the only null pointer constant."
    "8.2.2": "Do not use C-style or functional-notation casts."
    "8.7.1": "Pointer arithmetic must not create an invalid pointer."
    "8.7.2": "Subtract pointers only within the same array."
    "8.9.1": "Compare pointers relationally only within the same array."
    "8.18.1": "Do not copy an object onto storage that overlaps it."
    "9.3.1": "Loop and selection bodies must be compound statements (braced)."
    "9.6.1": "Avoid goto."
    "9.6.5": "A non-void function returns a value on every path."
    "10.1.1": "Const-qualify the pointee of pointer and reference parameters where possible."
    "11.3.1": "Avoid declaring C-style arrays."
    "11.6.2": "Do not read an object before it has been set."
    "13.3.1": "Use virtual, override and final consistently on member functions."
    "15.1.1": "Do not use an object's dynamic type while it is being constructed or destroyed."
    "15.1.3": "Make single-argument constructors and conversion operators explicit."
    "15.1.4": "Initialise all non-static data members before the object can be used."
    "DIR-15.8.1": "User-written copy and move assignment operators must cope with self-assignment."
    "19.3.5": "Do not put directive-like tokens inside macro arguments."
    "21.6.1": "Avoid dynamic memory."
    "21.6.2": "Manage dynamic memory automatically (RAII), not by hand."
    "21.10.1": "Do not use <cstdarg>."
    "21.10.2": "Do not use <csetjmp>."
    "21.10.3": "Do not use the facilities of <csignal>."
    "28.6.3": "Do not use an object that may have been moved from."
    "28.6.4": "Use the result of std::remove, std::remove_if, std::unique and empty()."
    "30.0.1": "Do not use the C library input/output functions."
  autosar-cpp14:
    "M0-1-1": "No code that can never be reached."
    "M0-1-2": "No paths that can never be taken."
    "M0-1-3": "No variables that are never used."
    "M0-1-9": "No dead code."
    "M0-1-10": "Every defined function should be called."
    "A0-1-1": "Do not assign values to non-volatile variables that are never read afterwards."
    "A0-1-2": "Use the value a non-void function returns."
    "M0-2-1": "Do not copy an object onto storage that overlaps it."
    "A2-10-1": "Do not hide an identifier from an outer scope."
    "M3-2-2": "Do not violate the one-definition rule."
    "M3-4-1": "Declare identifiers in the smallest block scope possible."
    "A3-9-1": "Use the fixed-width integer typedefs instead of the basic numeric types."
    "A4-10-1": "Use only nullptr as the null pointer constant."
    "A5-0-2": "Conditions of if and loop statements must have type bool."
    "A5-1-1": "Avoid unexplained literal values; use named constants."
    "A5-2-2": "Do not use C-style casts."
    "A5-2-5": "Do not access arrays or containers out of bounds."
    "A5-3-2": "Do not dereference null pointers."
    "A5-6-1": "The divisor must not be zero."
    "M5-0-16": "Pointer arithmetic must stay within the same array."
    "M5-0-17": "Subtract pointers only within the same array."
    "M5-0-18": "Compare pointers relationally only within the same array."
    "M5-8-1": "Keep shift amounts within the width of the left operand."
    "M5-18-1": "Do not use the comma operator."
    "A6-6-1": "Do not use goto."
    "M6-3-1": "switch, while, do and for bodies must be compound statements (braced)."
    "M6-4-1": "if and else bodies must be compound statements (braced)."
    "M6-4-6": "End every switch with a default clause."
    "A7-1-6": "Do not use typedef; prefer using aliases."
    "A7-5-1": "Do not return a reference or pointer to a parameter passed by reference to const."
    "A8-4-1": "Do not define variadic functions with an ellipsis."
    "A8-4-2": "A non-void function returns a value on every path."
    "A8-5-0": "Initialise all memory before reading it."
    "A9-5-1": "Do not use unions."
    "A10-3-1": "Declare a virtual function with exactly one of virtual, override or final."
    "M12-1-1": "Do not use an object's dynamic type in its constructor or destructor."
    "A12-1-1": "Constructors must initialise all base classes and non-static data members."
    "A12-1-4": "Make constructors callable with one fundamental-type argument explicit."
    "A12-8-3": "Do not read an object after it has been moved from."
    "A15-1-4": "Do not leak resources when an exception is thrown."
    "A15-4-2": "A noexcept function must not throw."
    "M16-0-5": "Do not put directive-like tokens inside macro arguments."
    "A18-1-1": "Do not use C-style arrays."
    "A18-5-1": "Do not use malloc, calloc, realloc or free."
    "A18-5-2": "Do not call non-placement new or delete expressions directly."
    "A18-5-3": "Match each form of new with the corresponding form of delete."
    "M18-0-3": "Do not use abort, exit, getenv or system from <cstdlib>."
    "M18-0-4": "Do not use the <ctime> time functions."
    "M18-0-5": "Do not use the unbounded <cstring> functions."
    "M19-3-1": "Do not use errno."
    "A20-8-1": "Do not let more than one smart pointer own the same raw pointer."
    "A23-0-2": "Do not use iterators, pointers or references a container has invalidated."
    "M27-0-1": "Do not use the <cstdio> stream functions."

# Curated analyzer mappings. Checker names are the analyzers' own; `specific: true`
# only where the check reports exactly the construct the guideline forbids.
checkers:
  misra-c-2012:
