# Deterministic pre-filter for the LLM review packet.
# A rule becomes a *candidate* for a code hunk when one of its patterns
# matches the hunk text. Patterns are Python regular expressions applied to
# the hunk. `categories` supply a fallback for rules without their own list.
# Nothing here asserts a violation; it only decides which rule texts the
# reviewer must read.
categories:
  MEM: ['\b(malloc|calloc|realloc|free|aligned_alloc|posix_memalign|strdup|alloca)\s*\(', '\bnew\b', '\bdelete\b', '\b(unique_ptr|shared_ptr|intrusive_ptr|ref_t|make_ref|make_shared|make_unique)\b', '\b(put|get)\s*\(\s*\)']
  ARR: ['\[[^\]]+\]', '\b(memcpy|memmove|memset|memcmp|strncpy|copy_out|copy_in|c_str|data)\s*\(', 'sizeof\s*[(\w]', '\b(begin|end)\s*\(\s*\)\s*[+-]']
  STR: ['\b(str(cpy|cat|ncpy|ncat|len|dup|tok|cmp)|sprintf|snprintf|gets|fgets|wcs\w+|strerror|std::string|string_view|c_str)\b', '\bchar\s*\*?\s*\w+\s*\[']
  INT: ['\b(size_t|ssize_t|uint\d+_t|int\d+_t|unsigned|off_t|uint64_t|int64_t)\b.*[-+*/<>]', '\bsizeof\b', '<<|>>', '\(\s*(u?int\d*_t|int|long|short|unsigned|char|size_t)\s*\)\s*\w']
  CON: ['\b(mutex|lock_guard|unique_lock|scoped_lock|condition_variable|atomic|thread|pthread_\w+|std::async|call_once|shared_mutex|make_mutex|\.lock\(\)|\.unlock\(\))\b']
  FIO: ['\b(fopen|fclose|fread|fwrite|fseek|ftell|fgets|fprintf|printf|snprintf|open|close|read|write|pread|pwrite|unlink|rename|remove|tmpfile|mkstemp|ifstream|ofstream|fstream)\s*[(\w]']
  ERR: ['\b(throw|catch|noexcept|abort|exit|_exit|errno|std::terminate|ceph_assert|ceph_abort|setjmp|longjmp)\b', '\bint\s+r\s*=', '\breturn\s+-E']
  EXP: ['\b(if|while)\s*\([^)]*[^=!<>]=[^=]', '\b(nullptr|NULL)\b', '\bconst_cast\b|\breinterpret_cast\b|\bstatic_cast\b|\(\s*\w+\s*\*\s*\)', '\[[&=]', '\bvolatile\b', '\bstd::move\b']
  DCL: ['\bextern\b', '\bstatic\b', '\b__\w+|\b_[A-Z]\w+', '\benum\b', '\bunion\b', '\bnamespace\b']
  PRE: ['^\s*#\s*(define|undef|include|if|ifdef|ifndef)\b']
  MSC: ['\b(rand|srand|random|mt19937|random_device)\b', '\b(system|popen|getenv|setenv)\s*\(', '(password|passwd|secret|token|key)\s*=\s*"', '\b(memset|bzero|explicit_bzero)\b']
  OOP: ['\b(virtual|override|final|operator\s*=|operator\s*\w+|~\w+\s*\(|explicit)\b', '\b(memcpy|memset|memcmp)\s*\(\s*(this|\*this)\b', '\bstruct\b|\bclass\b']
  CTR: ['\b(std::)?(vector|map|set|list|deque|unordered_\w+|array|string)\s*<', '\.(begin|end|erase|insert|push_back|emplace\w*|find|at)\s*\(', '\[[^\]]+\]']
  SIG: ['\b(signal|sigaction|raise|kill|SIG[A-Z]+|longjmp|sig_atomic_t)\b']
  ENV: ['\b(getenv|setenv|putenv|unsetenv|system|popen|exec[lv]\w*)\s*\(']
  POS: ['\b(fork|exec\w*|pthread_\w+|chroot|setuid|seteuid|setgid|chmod|umask|open|socket|bind|accept)\s*\(']
  FLP: ['\b(float|double|isnan|isinf|fenv|FE_\w+)\b']
  API: ['.']
  WIN: ['\bWIN32\b|\b_WIN32\b|\bHANDLE\b']
rules:
  # --- expressions / memory ---
  EXP34-C: ['\b\w+\s*->', '\*\s*\w+\s*[;=)\]]', '\b(malloc|calloc|realloc|dynamic_cast|find|strchr|strstr|getenv|fopen)\s*\(']
  EXP33-C: ['\b(int|char|short|long|unsigned|size_t|u?int\d+_t|bool|double|float)\s+\w+\s*;', '\bmalloc\s*\(']
  EXP35-C: ['\bf\w*\(\)\.\w+', '\)\s*\.\s*\w+\s*\[']
  EXP36-C: ['\(\s*(struct\s+)?\w+\s*\*\s*\)\s*&?\w+', 'reinterpret_cast']
  EXP39-C: ['\(\s*(struct\s+)?\w+\s*\*\s*\)', 'reinterpret_cast']
  EXP45-C: ['\b(if|while)\s*\([^=!<>]*[^=!<>]=[^=]']
  EXP50-CPP: ['\w+\s*\(\s*[^)]*\+\+|\+\+\s*\w+[^;]*\w+', '\b\w+\s*=\s*[^;]*\b\w+\+\+']
  EXP53-CPP: ['\b(int|char|short|long|unsigned|bool|double|float|size_t|u?int\d+_t)\s+\w+\s*;', '\b\w+_t\s+\w+\s*;']
  EXP54-CPP: ['\[[&=]', 'return\s+&?\s*\w+\s*;', '\bstd::(string_view|span)\b', '\.c_str\(\)', '\bdata\(\)']
  EXP61-CPP: ['\[\s*&', '\[\s*[^\]]*&\w+[^\]]*\]\s*\(', 'co_spawn|\.then\(|Finisher|Context|asio::']
  EXP62-CPP: ['\b(memcmp|memcpy|memset|bit_cast)\s*\(', 'reinterpret_cast', 'union']
  MEM30-C: ['\b(free|delete)\b', '->put\(\)', '\bstd::move\b']
  MEM31-C: ['\b(malloc|calloc|realloc|strdup|new)\b', '\bfree\b']
  MEM34-C: ['\bfree\s*\(', '\brealloc\s*\(']
  MEM35-C: ['\bmalloc\s*\(', 'alloca\s*\(', '\bnew\b.*\[']
  MEM36-C: ['\brealloc\s*\(']
  MEM50-CPP: ['\bdelete\b', '->put\(\)', 'release\s*\(\)', 'std::move', '\b(unique_ptr|shared_ptr|intrusive_ptr|ref_t)\b']
  MEM51-CPP: ['\bnew\b', '\bdelete\b', '\bfree\b', '\bRefCounted']
  MEM52-CPP: ['\bnew\s*\(\s*std::nothrow', '\b(malloc|calloc|realloc)\s*\(', '\bnew\b']
  MEM53-CPP: ['\bnew\b', 'placement', '~\w+\s*\(', 'malloc']
  MEM54-CPP: ['placement\s+new|new\s*\(\s*\w+\s*\)\s*\w+', 'alignas']
  MEM55-CPP: ['operator\s+(new|delete)']
  MEM56-CPP: ['\b(shared_ptr|unique_ptr|intrusive_ptr)\s*<[^>]*>\s*\(\s*(this|\w+\s*\*)', '\.get\(\)\s*\)', '\bshared_ptr\s*<[^>]*>\s*\w+\s*\(\s*\w+\s*\)']
  MEM57-CPP: ['alignas|aligned_alloc|operator new']
  # --- arrays, strings, containers ---
  ARR30-C: ['\[[^\]]+\]', '\+\s*\w+\s*\)?\s*\[?']
  ARR37-C: ['\(\s*\w+\s*\*\s*\)\s*\w+\s*\+', 'ptr\s*\+\s*\w+', '\b(begin|data|c_str)\(\)\s*\+']
  ARR38-C: ['\b(memcpy|memmove|memset|strncpy|memcmp|fread|read|snprintf|copy_out|copy_in)\s*\(']
  ARR39-C: ['\bsizeof\s*\([^)]*\)\s*\*|\*\s*sizeof', '\(\s*\w+\s*\*\s*\)\s*\w+\s*\+\s*\w+', '\+\s*sizeof']
  STR31-C: ['\b(strcpy|strcat|sprintf|gets|strncpy|strncat|memcpy)\s*\(', '\bchar\s+\w+\s*\[\s*\d*\s*\]']
  STR32-C: ['\bstrncpy\s*\(', '\bstrncat\s*\(', '\bchar\s+\w+\s*\[', '\bstd::string\(\s*\w+\s*,\s*\w+\s*\)']
  STR34-C: ['\bchar\b.*\b(isalpha|isdigit|toupper|tolower|isspace)\s*\(', '\b(isalpha|isdigit|isspace|isalnum|toupper|tolower)\s*\(']
  STR37-C: ['\b(isalpha|isdigit|isspace|isalnum|toupper|tolower|isxdigit|ispunct)\s*\(']
  STR38-C: ['\b(strcpy|strlen|strcmp|wcscpy|wcslen)\s*\(', 'wchar_t', 'L"']
  STR50-CPP: ['\bchar\s+\w+\s*\[', '\b(strcpy|strcat|sprintf|cin\s*>>)\b', 'std::getline']
  STR51-CPP: ['\bstd::string\s*[({]\s*(nullptr|NULL|0|getenv\s*\()', 'std::string\s+\w+\s*=\s*getenv']
  STR52-CPP: ['\b(string|string_view)\b.*\b(begin|end|c_str|data)\(\)', 'std::string_view']
  STR53-CPP: ['\bstd::string\b.*\[[^\]]+\]', '\.\s*at\s*\(', '\boperator\[\]']
  CTR50-CPP: ['\[[^\]]+\]', '\.at\s*\(', '\b(erase|insert|resize|reserve)\s*\(', '\.\s*(front|back)\s*\(']
  CTR51-CPP: ['\b(erase|insert|push_back|emplace\w*|clear|resize|reserve|rehash)\s*\(', 'for\s*\(\s*(auto|const auto)\s*&?\s*\w+\s*:', '\.(begin|end)\(\)']
  CTR52-CPP: ['\b(copy|transform|fill_n|copy_n|back_inserter|memcpy|std::copy)\s*\(']
  CTR53-CPP: ['\b(begin|end)\(\)\s*[,)].*\b(begin|end)\(\)', 'std::(sort|find|copy|equal)\s*\(']
  CTR54-CPP: ['\b(\w+)\.end\(\)\s*-\s*\w+\.begin\(\)', 'iterator[^;]*-[^;]*iterator', '\.begin\(\)\s*-|\.end\(\)\s*-']
  CTR55-CPP: ['\.(begin|end)\(\)\s*\+\s*\w+', 'std::next\s*\(']
  CTR56-CPP: ['\b(Base|base)\s*\*\s*\w+\s*;.*\+\+|\w+\s*\+\+', 'virtual']
  CTR57-CPP: ['\bstd::(priority_queue|set|map|multiset|multimap)\b', 'operator\s*<|Compare']
  CTR58-CPP: ['std::(sort|stable_sort|partial_sort|nth_element|lower_bound|upper_bound)\s*\(', '\bstd::(find_if|remove_if)\b']
  # --- integers / floating point ---
  INT30-C: ['\b(size|len|length|count|offset|off|bytes|num)\w*\s*[-+*]\s*\w+', '\+\+|--', '\*\s*\w+\s*\)\s*;']
  INT31-C: ['\(\s*(u?int\d+_t|int|long|short|unsigned|char|size_t)\s*\)', '\b(int|unsigned|short)\s+\w+\s*=\s*\w+\.(size|length)\(\)']
  INT32-C: ['\b(int|long|ssize_t|int\d+_t)\b[^;]*[-+*]', '\babs\s*\(', '-\s*\w+\s*;']
  INT33-C: ['\w+\s*[/%]\s*\w+', '\bdiv\s*\(']
  INT34-C: ['<<|>>', '\b1\s*<<']
  INT35-C: ['\bint\s+\w+\s*=\s*\w+\.size\(\)', 'u?int\d*_t\s+\w+\s*=\s*\w+']
  INT36-C: ['\(\s*(u?int\w*|size_t|long)\s*\)\s*\w*\s*\*?\s*\w+\s*;', 'uintptr_t|intptr_t', 'reinterpret_cast<\s*(u?int|size_t|uintptr_t|intptr_t)']
  FLP30-C: ['for\s*\([^;]*\b(float|double)\b']
  FLP32-C: ['\b(sqrt|log|log2|log10|pow|acos|asin|atan2|fmod)\s*\(']
  FLP34-C: ['\(\s*(int|long|unsigned|size_t|u?int\d+_t)\s*\)\s*\w*\s*(float|double)|\b(int|long)\s+\w+\s*=\s*\w*\s*(sqrt|floor|ceil|round)']
  FLP36-C: ['\bfloat\b.*(int|long)|\b(int|long)\b.*\bfloat\b']
  FLP37-C: ['\bmemcmp\s*\([^)]*\b(float|double)']
  # --- error handling / misc ---
  ERR30-C: ['\berrno\b', '\b(strtol|strtoul|strtoll|strtod|fopen|fgets)\s*\(']
  ERR33-C: ['^\s*(\w+::)*(fclose|fread|fwrite|fseek|read|write|close|mkdir|unlink|rename|pthread_\w+|setenv|snprintf|memcpy_s|fflush|chdir|chmod|ftruncate)\s*\(']
  ERR34-C: ['\b(atoi|atol|atoll|atof|sscanf|strtol|strtoul|strtoll|strtoull)\s*\(']
  ERR50-CPP: ['\b(abort|exit|_Exit|quick_exit|terminate)\s*\(']
  ERR51-CPP: ['\bcatch\s*\(']
  ERR52-CPP: ['\b(setjmp|longjmp)\b']
  ERR53-CPP: ['~\w+\s*\(', 'catch\s*\(\.\.\.\)']
  ERR54-CPP: ['catch\s*\(']
  ERR55-CPP: ['\bthrow\s*\(', 'noexcept\s*\(?\s*(false)?']
  ERR56-CPP: ['\bnoexcept\b', 'throw\s*\(']
  ERR57-CPP: ['\bnew\b', '\b(fopen|open|malloc)\s*\(', 'throw']
  ERR58-CPP: ['^\s*(static|const)?\s*(std::)?\w[\w:<>, ]*\s+\w+\s*(=|\{|\()[^;]*;', 'thread_local|static\s+\w+']
  ERR59-CPP: ['\bthrow\b', 'std::(thread|async|function)\b', 'extern\s+"C"']
  ERR60-CPP: ['\bthrow\s+\w+', 'class\s+\w+\s*:\s*public\s+(std::)?(exception|runtime_error|logic_error)']
  ERR61-CPP: ['\bcatch\s*\(\s*(const\s+)?\w+(::\w+)*\s*[^&\s)]*\s*\w*\s*\)', '\bthrow\s+new\b']
  ERR62-CPP: ['\b(istringstream|stringstream|ifstream|cin)\b', '>>']
  CON50-CPP: ['~\w+\s*\(', 'mutex', 'delete']
  CON51-CPP: ['\.lock\(\)', '\.unlock\(\)', 'pthread_mutex_(un)?lock']
  CON52-CPP: ['\bint\s+\w+\s*:\s*\d+|:\s*\d+\s*;', 'bitfield|bit-field']
  CON53-CPP: ['\b(lock|try_lock)\s*\(', 'lock_guard|unique_lock|scoped_lock']
  CON54-CPP: ['\.wait\s*\(\s*\w+\s*\)', 'condition_variable']
  CON55-CPP: ['notify_(one|all)', 'condition_variable']
  CON56-CPP: ['\block\s*\(\)', 'recursive']
  CON30-C: ['pthread_key|tss_|thread_local']
  CON31-C: ['mutex_destroy|~\w*\(']
  CON33-C: ['\b(strerror|strtok|localtime|gmtime|asctime|ctime|rand|getenv)\s*\(']
  CON35-C: ['mutex|lock']
  CON40-C: ['atomic', '\+\+|--|\+=|-=']
  CON41-C: ['compare_exchange_(weak|strong)|atomic_compare']
  SIG30-C: ['\b(signal|sigaction)\b']
  SIG31-C: ['\b(signal|sigaction)\b']
  SIG34-C: ['\bsignal\s*\(']
  SIG35-C: ['SIGSEGV|SIGFPE|SIGILL|SIGBUS|\bsignal\b']
  MSC30-C: ['\b(rand|srand|random|drand48)\s*\(']
  MSC32-C: ['\b(srand|srandom|mt19937|default_random_engine)\b']
  MSC33-C: ['\b(asctime|ctime)\s*\(']
  MSC37-C: ['\bint\s+\w+\s*\([^)]*\)\s*\{']
  MSC40-C: ['\binline\b', 'static\s+inline|extern\s+inline']
  MSC41-C: ['(password|passwd|secret|token|key|credential)\w*\s*(=|\[\])\s*"[^"]{4,}"', 'AKIA[0-9A-Z]{8,}']
  MSC50-CPP: ['\b(rand|srand|random_shuffle)\s*\(']
  MSC51-CPP: ['\b(mt19937|default_random_engine|minstd_rand|random_device)\b']
  MSC52-CPP: ['\bnoreturn\b']
  MSC53-CPP: ['\[\[\s*noreturn\s*\]\]']
  MSC54-CPP: ['\b(signal|sigaction)\b']
  OOP50-CPP: ['(constructor|ctor|~\w+).*\b(virtual|dispatch|call)\b', '\b\w+::\w+\s*\(\s*\)\s*(:\s*\w+\(.*\))?\s*\{', 'virtual']
  OOP51-CPP: ['\bBase\b|\bclass\s+\w+\s*:\s*public', 'slic']
  OOP52-CPP: ['~\w+\s*\(', 'virtual', 'delete\s+\w+']
  OOP53-CPP: [':\s*\w+\s*\(.*\)\s*,\s*\w+\s*\(', 'member initializer', ':\s*(m_)?\w+\s*\(']
  OOP54-CPP: ['operator\s*=\s*\(']
  OOP55-CPP: ['\boperator\s*(->\*|&&|\|\||,|&)\s*\(', 'operator\s*[-+*/<>=!]+']
  OOP56-CPP: ['\b(set_terminate|set_new_handler|set_unexpected)\b']
  OOP57-CPP: ['\b(memcpy|memset|memcmp|memmove)\s*\(']
  OOP58-CPP: ['\w+\(\s*(const\s+)?\w+\s*&\s*\w*\s*\)\s*(:|\{)', 'copy constructor']
  DCL50-CPP: ['\.\.\.\s*\)|va_list|va_start']
  DCL51-CPP: ['\b(_[A-Z]\w*|__\w+)\b', '#\s*define\s+_']
  DCL52-CPP: ['\bconst\s+volatile|\bvolatile\s+const|\bconst\b[^;]*\bconst\b']
  DCL53-CPP: ['\b\w+\s+\w+\s*\([^)]*\)\s*;']
  DCL54-CPP: ['operator\s+(new|delete)']
  DCL55-CPP: ['\bstruct\s+\w+\s*\{[^}]*\}', 'send|write|encode|memcpy']
  DCL56-CPP: ['\bstatic\b[^;]*=\s*\w+\s*\(', 'extern']
  DCL57-CPP: ['~\w+\s*\(|operator\s+delete|noexcept\s*\(\s*false']
  DCL58-CPP: ['namespace\s+std\b', 'std::\w+\s*<[^>]*>\s*;']
  DCL59-CPP: ['namespace\s*\{']
  DCL60-CPP: ['\binline\b', 'class\s+\w+', 'ODR']
  DCL30-C: ['return\s+&\w+\s*;', '\*\s*\w+\s*=\s*&\w+', 'static']
  DCL37-C: ['\b_[A-Za-z]\w*|__\w+', '#\s*define\s+_']
  DCL38-C: ['\[\s*1\s*\]|\[\s*0\s*\]', '\w+\s+\w+\[\]']
  DCL39-C: ['struct[^;]*\{[^}]*\}', 'pack|padding']
  DCL40-C: ['\bextern\b', 'int\s+\w+\s*\(\s*\)\s*;']
  DCL41-C: ['\bswitch\b[^{]*\{[^}]*\b(int|char|float|double)\s+\w+\s*[=;]']
  FIO30-C: ['\b(printf|fprintf|sprintf|snprintf|syslog|dprintf|vsnprintf)\s*\(\s*(\w+\s*,\s*)*\w+\s*\)\s*;']
  FIO32-C: ['\b(open|fopen|stat|lstat|access)\s*\(\s*\w+']
  FIO34-C: ['\b(fgetc|getc|getchar)\s*\(', 'EOF']
  FIO37-C: ['\bfgets\s*\(', 'strlen\s*\(\s*\w+\s*\)']
  FIO38-C: ['\bFILE\s+\w+\b', 'sizeof\s*\(\s*FILE\s*\)']
  FIO39-C: ['\b(fseek|fread|fwrite|ftell|fflush)\s*\(']
  FIO40-C: ['\bfgets\s*\(', 'buf\w*']
  FIO41-C: ['\b(getc|putc|fgetc|fputc)\s*\([^)]*[+]{2}']
  FIO42-C: ['\b(open|fopen|socket|pipe|accept|dup|opendir)\s*\(', '\bclose\s*\(']
  FIO44-C: ['\bfsetpos\s*\(', 'fpos_t']
  FIO45-C: ['\b(access|stat|lstat)\s*\([^)]*\)[^;]*\b(open|fopen)\s*\(', '\bfopen\s*\(']
  FIO46-C: ['\b(fclose|close)\s*\([^)]*\)[\s\S]{0,200}\b(read|write|fread|fwrite)\b']
  FIO47-C: ['\b(printf|fprintf|sprintf|snprintf|scanf|sscanf|fscanf)\s*\(']
  ENV30-C: ['\bgetenv\s*\([^)]*\)\s*\[', '\bgetenv\b']
  ENV32-C: ['\b(atexit|at_quick_exit|exit|quick_exit)\s*\(']
  ENV33-C: ['\b(system|popen)\s*\(']
  ENV34-C: ['\bgetenv\s*\(']
  POS30-C: ['\breadlink\s*\(']
  POS34-C: ['\bputenv\s*\(']
  POS35-C: ['\b(lstat|stat|access)\s*\([^)]*\)[\s\S]{0,200}\b(open|fopen|unlink)\s*\(']
  POS36-C: ['\b(setuid|seteuid|setgid|setegid|setreuid|setresuid|chroot)\s*\(']
  POS37-C: ['\bchroot\s*\(']
  POS38-C: ['\bfork\s*\(', '\bposix_spawn']
  POS39-C: ['\b(htons|htonl|ntohs|ntohl|le32toh|be32toh)\b']
  POS44-C: ['pthread_kill']
  POS47-C: ['pthread_cancel|pthread_setcanceltype']
  POS48-C: ['pthread_mutex_(un)?lock|pthread_mutexattr']
  POS49-C: ['bit-?field|:\s*\d+\s*;', 'pthread']
  POS50-C: ['pthread_mutex_lock|pthread_cond_wait']
  POS51-C: ['pthread_mutex_lock[\s\S]{0,300}pthread_mutex_lock']
  POS52-C: ['pthread_mutex_lock[\s\S]{0,300}(sleep|read|write|poll|accept)']
  POS53-C: ['pthread_mutex_lock[\s\S]{0,300}pthread_cond_wait']
  POS54-C: ['\bpthread_\w+\s*\(']
  PRE30-C: ['##']
  PRE31-C: ['#\s*define\s+\w+\s*\([^)]*\)']
  PRE32-C: ['#\s*(if|ifdef|ifndef|else|endif)', '\w+\s*\([^)]*#']
  API00-C: ['.']
