# cert-review MCP-style PR comment on pull_request_target (fork-safe with GITHUB_TOKEN).
# Copy to .github/workflows/pr-cert-review-mcp.yml — same trigger style as Ceph pr-triage.yml.
name: "Pull Request cert-review (MCP)"
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.h"
      - "**/*.hpp"

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-cert-review-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Draft PR comment (review-pr)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          IMAGE=raminnietzsche/cert-review-mcp:latest
          docker pull "$IMAGE"
          if ! docker run --rm -w "$GITHUB_WORKSPACE" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$IMAGE" cert-review review-pr \
                --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" \
                --title "$PR_TITLE" --profile ceph --min-confidence 0.5 \
                --fail-on never --github-footer pull_request_target \
                -o cert-review-pr-comment.md 2>/dev/null; then
            docker run --rm -w "$GITHUB_WORKSPACE" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$IMAGE" cert-review review-pr \
                --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" \
                --title "$PR_TITLE" --profile ceph --min-confidence 0.5 \
                --fail-on never -o cert-review-pr-comment.md
            printf '\n<details>\n<summary>cert-review-mcp · auto-generated</summary>\n\nReport drafted with **[cert-review-mcp](https://github.com/RaminNietzsche/cert-review-mcp)** (`pull_request_target`).\n\n</details>\n' >> cert-review-pr-comment.md
          fi
          test -s cert-review-pr-comment.md

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: cert-review-pr-comment.md
          edit-mode: replace
          body-includes: "<!-- cert-review -->"